<!doctype html>
<!--
  Pa' Bailar admin page (docs/ADMIN.md), served by a Cloudflare Worker from admin-web/ (wrangler.jsonc).
  This file has no data: after signing in with GitHub, app.js asks the Worker (src/index.js) for the status.
  Installed on Android (manifest.webmanifest), it shows up in the share menu: a shared post opens it with the link,
  shared story screenshots (received by sw.js) go to "Agregar desde una historia".
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#161112" />
    <title>Pa' Bailar · Admin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/192.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Instrument+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="top">
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="top__row">
        <h1>Pa' Bailar <span>Admin</span></h1>
        <p class="top__user" id="user" hidden></p>
      </div>
    </header>
    <main id="main">
      <p class="muted">Cargando…</p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
