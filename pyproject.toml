[project]
name = "pa-bailar-backend"
version = "0.1.0"
description = "Collects one-time dance events in Bogotá from Instagram and publishes them to the site."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, naming, pyupgrade, bugbear, simplify, complexity
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12 # past this, split the function into named steps

[tool.mypy]
python_version = "3.12"
files = ["pa_bailar"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["dotenv.*"]
ignore_missing_imports = true
