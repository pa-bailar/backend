# The `ci` check on every pull request: lint (ruff), format check, type check (mypy, strict) and unit tests
# (pytest), and the admin page's Worker tests (admin-web/test, Node's own test runner). The video toolkit has its own
# workflow, media-ci.yml, which starts only when media/ changes. Not enforced: main isn't protected (rulesets on private
# repositories need a paid plan), so PRs merge when it's green by convention.
#
# Actions minutes (this repository is private: 2,000 a month on the free plan, and each job is billed as at least one
# whole minute). So it doesn't run again on main after a merge (the PR already ran the same checks); a weekly run on
# main keeps the pip cache saved where every branch can use it (caches made on a PR stay with that PR).
name: ci

on:
  pull_request:
    # A pull request that changes only these doesn't run it: nothing in them is linted or tested, and each run bills a
    # whole Actions minute of this private repository's 2,000 a month (the owner, 6 Oct 2026). Such a PR has no checks
    # to wait for.
    paths-ignore:
      - "media/site-checks/**" # the site checks run on this machine only, never here (media/site-checks/README.md)
      - "docs/**"
      - "**/*.md"
      - ".claude/**" # the skills, the context, the hooks: Claude Code's, not tested here
  schedule:
    - cron: "17 11 * * 1" # Mondays 06:17 Bogotá, clear of the sweeps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Admin page Worker tests
        run: node --test "admin-web/test/*.test.mjs"
