# The `ci` check on every pull request: lint (ruff), format check, type check (mypy, strict) and unit tests
# (pytest). Not enforced: main isn't protected (rulesets on private repositories need a paid plan), so PRs merge
# when it's green by convention. Also runs on main after each merge, so the pip cache is saved where every
# branch can use it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest -q
