# The admin inbox (docs/ADMIN.md): issues and comments in this repository that ask the admin tools for
# something (check a post, add a post or an account, the status), answered with a comment. Only the admin's
# own issues and comments count; the admin page (admin-web/) opens such issues for them. Of those, only issues
# labelled `admin` (the issue form, the admin page) or texts that ask for something the inbox understands get
# an answer: the admin's other issues and comments are left alone.
#
# No AI here: `python -m pa_bailar admin inbox` (pa_bailar/inbox.py) reads the request with fixed patterns.
# Adding a post or a story (from its screenshots), and hiding a story or an event, need Gemini or write the site's
# data, so they continue in the sweep workflow (one at a time with the sweeps: concurrency "data"), which comments
# the result on the same issue.
name: admin

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write # accounts.txt, when an account is added
  issues: write # the answer
  actions: write # start the sweep workflow to add a post or a story, or hide a story or an event

# No concurrency group: GitHub keeps only one waiting run per group, so a third comment on an issue (even one
# that isn't a request) would cancel the second one's run, and its request would never be answered. Adding a
# post, the one request that must wait its turn, waits for earlier runs itself (below).

env:
  STATE_FILES: state
  ISSUE: ${{ github.event.issue.number }}

jobs:
  answer:
    # Only the admin (the bot's own comments never start workflows), and never on pull requests or the
    # sweep health issue.
    if: >-
      github.event.sender.login == 'jzamora5' &&
      !github.event.issue.pull_request &&
      !contains(github.event.issue.labels.*.name, 'sweep-health')
    runs-on: ubuntu-latest
    timeout-minutes: 60 # adding a post may wait up to 50 min for the sweeps and earlier requests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the sweep state
        uses: actions/checkout@v7
        with:
          ref: sweep-state
          path: sweep-state
          persist-credentials: false
      - run: mkdir -p "$STATE_FILES" && cp sweep-state/*.json "$STATE_FILES"/

      - name: Check out the site's data (to see which events are on the site)
        uses: actions/checkout@v7
        with:
          repository: pa-bailar/pa-bailar.github.io
          path: site
          sparse-checkout: data/events.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt

      - name: Answer
        id: answer
        env:
          # The request, as data: never pasted into a script.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DATA_DIR: ${{ github.workspace }}/site/data
          INBOX_REPLY: ${{ github.workspace }}/reply.md
          ADMIN_ISSUE: ${{ contains(github.event.issue.labels.*.name, 'admin') }} # else: only a real request
        run: python -m pa_bailar admin inbox

      # From here on, only for requests (`action` is "skip" for anything else). The sweep workflow only adds posts
      # for an open issue labelled `admin`.
      - name: Label the issue as an admin request
        if: ${{ !cancelled() && steps.answer.outputs.action != '' && steps.answer.outputs.action != 'skip' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create admin --color 5319e7 --description "Admin tools (docs/ADMIN.md)" --force
          gh issue edit "$ISSUE" --add-label admin

      - name: Save the added account
        if: steps.answer.outputs.action == 'add-account'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCOUNT: ${{ steps.answer.outputs.account }}
        run: |
          if git diff --quiet -- accounts.txt; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git commit -qm "chore(accounts): add @${ACCOUNT} (admin inbox, #${ISSUE})" -- accounts.txt
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Write the reply if the answer failed
        if: >-
          !cancelled() && steps.answer.outputs.action != 'skip' &&
          (steps.answer.outputs.action != '' || contains(github.event.issue.labels.*.name, 'admin'))
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s reply.md ] || [ "$JOB_STATUS" != "success" ]; then
            echo "❌ Algo falló al responder. Detalles en [la ejecución]($RUN_URL)." > reply.md
          fi

      # Only on an admin issue by the owner (the action checks; labelled above), open or not: a request made by
      # commenting on an answered (closed) issue is answered too.
      - name: Reply
        if: >-
          !cancelled() && steps.answer.outputs.action != 'skip' &&
          (steps.answer.outputs.action != '' || contains(github.event.issue.labels.*.name, 'admin'))
        uses: ./.github/actions/answer-issue
        with:
          issue: ${{ github.event.issue.number }}
          body-file: ${{ github.workspace }}/reply.md
          close: ${{ steps.answer.outputs.done == 'true' }}
          require-open: "false"

      # GitHub keeps only one waiting run per concurrency group (the sweeps' "data"; a concurrency group here would
      # do the same): a newer one cancels it, and its request would never be answered. So requests take turns
      # instead, first come first served: this waits until no sweep is running or waiting AND no earlier admin
      # run is still going (it may be about to start one), then starts the sweep and waits until GitHub lists it,
      # so the next request sees it. Still busy after 50 minutes: it answers so and starts nothing.
      - name: Start adding the post or story, or hiding the story or event (sweep workflow)
        id: dispatch
        if: >-
          steps.answer.outputs.action == 'add-post' || steps.answer.outputs.action == 'add-story' ||
          steps.answer.outputs.action == 'hide-story' || steps.answer.outputs.action == 'hide-event'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.answer.outputs.action }}
          LINK: ${{ steps.answer.outputs.link }}
          ACCOUNT: ${{ steps.answer.outputs.account }}
          AGAIN: ${{ steps.answer.outputs.again == 'true' }} # "Volver a leer": read it even if unchanged
          IMAGES: ${{ steps.answer.outputs.images }} # add-story: the uploaded screenshots' ids
          NOTES: ${{ steps.answer.outputs.notes }}
          STORY: ${{ steps.answer.outputs.story }} # hide-story
          EVENT: ${{ steps.answer.outputs.event }} # hide-event: an event's id (inbox.EVENT_ID)
          WAIT_MINUTES: 50
        run: |
          sweeps_busy() {
            gh run list --workflow daily-sweep.yml --limit 20 --json status \
              --jq '[.[] | select(.status != "completed")] | length'
          }
          earlier_requests() {
            gh run list --workflow admin.yml --limit 30 --json databaseId,status \
              --jq '[.[] | select(.status != "completed" and .databaseId < (env.GITHUB_RUN_ID | tonumber))] | length'
          }
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while [ "$(sweeps_busy)" != "0" ] || [ "$(earlier_requests)" != "0" ]; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "⏳ Los barridos siguen ocupados después de ${WAIT_MINUTES} minutos: no empecé. Pídelo otra vez en un rato." > not-started.md
              exit 1
            fi
            echo "A sweep or an earlier request is running or waiting: checking again in 30 s"
            sleep 30
          done
          # The sweep only adds posts for an open admin issue (its `request` job): a request made by commenting
          # on an answered (closed) issue reopens it; the sweep's answer closes it again.
          gh issue reopen "$ISSUE" 2>/dev/null || true
          case "$ACTION" in
            add-post)
              gh workflow run daily-sweep.yml -f post_url="$LINK" -f account="$ACCOUNT" -f issue="$ISSUE" -f again="$AGAIN" ;;
            add-story)
              gh workflow run daily-sweep.yml -f story="$IMAGES" -f account="$ACCOUNT" -f notes="$NOTES" -f issue="$ISSUE" ;;
            hide-story)
              gh workflow run daily-sweep.yml -f hide="$STORY" -f issue="$ISSUE" ;;
            hide-event)
              gh workflow run daily-sweep.yml -f hide="$EVENT" -f issue="$ISSUE" ;;
          esac
          for _ in $(seq 1 12); do
            if [ "$(sweeps_busy)" != "0" ]; then exit 0; fi
            sleep 5
          done
          echo "::warning::The sweep run hasn't appeared yet; the next request may not wait for it."

      - name: Write why it couldn't start
        if: failure() && steps.dispatch.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s not-started.md ]; then
            printf '%s' "❌ No pude empezar. Detalles en [la ejecución]($RUN_URL)." > not-started.md
          fi

      - name: Say that it couldn't start
        if: failure() && steps.dispatch.conclusion == 'failure'
        uses: ./.github/actions/answer-issue
        with:
          issue: ${{ github.event.issue.number }}
          body-file: ${{ github.workspace }}/not-started.md
          require-open: "false" # it may not have reopened the issue yet
