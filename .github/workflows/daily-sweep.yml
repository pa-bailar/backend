# Every morning: collect new events from Instagram, publish real changes through a pull request,
# and republish the site with the time of the check.
#
# main only accepts pull requests that pass the `ci` check, with no exceptions, so the data goes
# through the same path as code:
#   sweep → (only if events or flyers changed) data/ branch → PR → ci → auto-merge → deploy
#
# Days without new events open no PR. The sweep's state (backend/state: analyzed posts, accounts'
# first-sweep progress, today's Gemini usage) is kept in the Actions cache between runs, so posts
# aren't sent to Gemini twice and quotas are shared by same-day runs; it is committed with the next
# real change. Losing the cache only means re-analyzing a few posts.
# Bump STATE_CACHE_VERSION when the state format changes, so the repo's committed state is used once.
#
# Events created with the workflow token don't trigger other workflows, so this workflow starts
# `ci` and `deploy` itself with workflow_dispatch (the one event the token is allowed to trigger).
name: daily-sweep

on:
  # Twice a day, at unusual minutes: GitHub delays (and under load drops) runs scheduled at the top
  # of the hour. Two runs also mean a dropped run doesn't leave the site stale, and the midday one
  # catches the morning's posts. They share Gemini's daily quotas (the usage is in the state cache)
  # and never overlap (concurrency below). Bogotá is UTC-5 all year.
  schedule:
    - cron: "23 10 * * *" # 5:23 AM Bogotá
    - cron: "47 17 * * *" # 12:47 PM Bogotá
  workflow_dispatch:
    inputs:
      days:
        description: "Only analyze posts from the last N days"
        default: "7"

permissions:
  contents: write # push the data branch
  pull-requests: write # open the data PR and enable auto-merge
  actions: write # start ci and deploy, save the state cache

concurrency:
  group: data
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  STATE_DIR: backend/state
  STATE_CACHE_VERSION: v2
  MERGE_TIMEOUT_MINUTES: 20

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore the sweep state
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STATE_DIR }}
          key: sweep-state-${{ env.STATE_CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: sweep-state-${{ env.STATE_CACHE_VERSION }}-

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Run the sweep
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LOOKBACK_DAYS: ${{ inputs.days || '7' }}
        run: python run_pipeline.py --days "$LOOKBACK_DAYS"

      - name: Save the sweep state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.STATE_DIR }}
          key: sweep-state-${{ env.STATE_CACHE_VERSION }}-${{ github.run_id }}

      - name: Open a data pull request if events or flyers changed
        id: pr
        if: ${{ !cancelled() }} # keep progress from a sweep that failed partway (it still shows as failed)
        run: |
          if [ -z "$(git status --porcelain -- data/events.json data/flyers)" ]; then
            echo "No new or changed events today: no pull request."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day="$(date -u +%F)"
          branch="data/sweep-${day}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add data/ backend/state/
          git commit -m "chore(data): daily sweep ${day}"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" --label data \
            --title "chore(data): daily sweep ${day}" \
            --body "Automatic data update from [daily-sweep run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Merges itself when \`ci\` passes.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Check the data PR and merge it when ci passes
        if: ${{ !cancelled() && steps.pr.outputs.url != '' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          deadline=$(( $(date +%s) + MERGE_TIMEOUT_MINUTES * 60 ))
          while true; do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then echo "Merged."; break; fi
            if [ "$state" = "CLOSED" ]; then echo "::error::The data PR was closed without merging."; exit 1; fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::The data PR did not merge within ${MERGE_TIMEOUT_MINUTES} minutes (did ci fail?): $PR_URL"
              exit 1
            fi
            sleep 30
          done

      - name: Publish the site with the time of this check
        if: success()
        run: gh workflow run deploy.yml --ref main -f checked_at="$(TZ=America/Bogota date --iso-8601=seconds)"

      # Dead man's switch (optional, only if the HEALTHCHECK_URL secret exists, e.g. a free healthchecks.io
      # check): every run reports success or failure, and the service emails when runs fail or stop
      # arriving at all, the case GitHub itself never reports.
      - name: Report to the health check
        if: ${{ always() }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 "$url" > /dev/null
