# Twice a day: collect new events from Instagram and publish real changes to the (public) site
# repository through a pull request.
#
#   this repo (private): sweep ── data PR ──▶ pa-bailar.github.io: ci → auto-merge → deploy
#
# - The site repository is reached with the pa-bailar-bot GitHub App (vars.APP_ID, secrets.APP_PRIVATE_KEY).
#   Its pull requests trigger the site's ci like anyone's, and its merges trigger the deploy.
# - Days without new events open no PR; the site is still republished with the time of the check.
# - The sweep's state (analyzed posts, accounts' first-sweep progress, today's Gemini usage) lives in
#   this repository's sweep-state branch: read before the run, written back after it, so posts aren't
#   sent to Gemini twice and the two daily runs share the quotas.
name: daily-sweep

on:
  # Twice a day, at unusual minutes: GitHub delays (and under load drops) runs scheduled at the top
  # of the hour. Two runs also mean a dropped run doesn't leave the site stale, and the midday one
  # catches the morning's posts. They share Gemini's daily quotas (the usage is in the state) and never
  # overlap (concurrency below). Bogotá is UTC-5 all year.
  schedule:
    - cron: "23 10 * * *" # 5:23 AM Bogotá
    - cron: "47 17 * * *" # 12:47 PM Bogotá
  workflow_dispatch:
    inputs:
      days:
        description: "Only analyze posts from the last N days"
        default: "7"

permissions:
  contents: write # push the sweep-state branch of this repository

concurrency:
  group: data
  cancel-in-progress: false

env:
  SITE_OWNER: pa-bailar
  SITE_REPO: pa-bailar.github.io
  STATE_DIR: backend/state
  MERGE_TIMEOUT_MINUTES: 20

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read the sweep state
        uses: actions/checkout@v7
        with:
          ref: sweep-state
          path: sweep-state

      - run: mkdir -p "$STATE_DIR" && cp sweep-state/*.json "$STATE_DIR"/

      - name: Get a token for the site repository (pa-bailar-bot)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.SITE_OWNER }}
          repositories: ${{ env.SITE_REPO }}

      - name: Check out the site repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_OWNER }}/${{ env.SITE_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: site

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Run the sweep
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DATA_DIR: ${{ github.workspace }}/site/data
          LOOKBACK_DAYS: ${{ inputs.days || '7' }}
        run: python run_pipeline.py --days "$LOOKBACK_DAYS"

      # Kept even when the sweep failed partway: its progress (analyzed posts) is real.
      - name: Save the sweep state
        if: ${{ !cancelled() }}
        working-directory: sweep-state
        run: |
          cp "$GITHUB_WORKSPACE/$STATE_DIR"/*.json .
          if [ -z "$(git status --porcelain)" ]; then echo "State unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(state): sweep $(date -u +%FT%H:%MZ)"
          git push -q origin HEAD:sweep-state

      - name: Open a data pull request in the site repository if events or flyers changed
        id: pr
        if: ${{ !cancelled() }} # keep progress from a sweep that failed partway (it still shows as failed)
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No new or changed events: no pull request."
            exit 0
          fi
          bot_id="$(gh api "/users/${BOT}" --jq .id)"
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          day="$(date -u +%F)"
          branch="data/sweep-${day}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add data/
          git commit -m "chore(data): daily sweep ${day}"
          git push origin "$branch"
          url="$(gh pr create --repo "$SITE_OWNER/$SITE_REPO" --base main --head "$branch" --label data \
            --title "chore(data): daily sweep ${day}" \
            --body "Automatic data update from the daily sweep (run ${GITHUB_RUN_ID} of the backend). Merges itself when \`ci\` passes.")"
          gh pr merge "$url" --auto --squash --delete-branch
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      # Its merge triggers the site's deploy (with meta.json's time, which is this sweep's).
      - name: Wait for the data PR to merge
        if: ${{ !cancelled() && steps.pr.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          deadline=$(( $(date +%s) + MERGE_TIMEOUT_MINUTES * 60 ))
          while true; do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then echo "Merged."; break; fi
            if [ "$state" = "CLOSED" ]; then echo "::error::The data PR was closed without merging."; exit 1; fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::The data PR did not merge within ${MERGE_TIMEOUT_MINUTES} minutes (did ci fail?): $PR_URL"
              exit 1
            fi
            sleep 30
          done

      - name: Republish the site with the time of this check (days without new events)
        if: ${{ success() && steps.pr.outputs.url == '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh workflow run deploy.yml --repo "$SITE_OWNER/$SITE_REPO" --ref main \
            -f checked_at="$(TZ=America/Bogota date --iso-8601=seconds)"

      # Dead man's switch (optional, only if the HEALTHCHECK_URL secret exists, e.g. a free healthchecks.io
      # check): every run reports success or failure, and the service emails when runs fail or stop
      # arriving at all, the case GitHub itself never reports.
      - name: Report to the health check
        if: ${{ always() }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 "$url" > /dev/null
