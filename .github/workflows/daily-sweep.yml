# Twice a day: collect new events from Instagram and publish real changes to the (public) site
# repository through a pull request.
#
#   this repo (private): sweep ── data PR ──▶ pa-bailar.github.io: ci → auto-merge → deploy
#
# - The site repository is reached with the pa-bailar-bot GitHub App (vars.APP_ID, secrets.APP_PRIVATE_KEY).
#   Its pull requests trigger the site's ci like anyone's, and its merges trigger the deploy.
# - Days without new events open no PR; the site is still republished with the time of the check.
# - The sweep's state (analyzed posts, accounts' turns and first-sweep progress, today's Gemini usage, the
#   run history, the admin page's status) lives in this repository's sweep-state branch: read before the
#   run, written back after it, so posts aren't sent to Gemini twice and the two daily runs share the quotas.
# - Started with `post_url` (by the admin workflow, docs/ADMIN.md), it adds that one post by hand instead of
#   sweeping (`sweep --post`), then answers on the admin issue. Such runs don't count for the health checks.
#   With `again` ("Volver a leer"), the post is read again even if it was read before and hasn't changed.
name: daily-sweep
run-name: ${{ inputs.post_url && format('Add a post by hand (#{0})', inputs.issue) || 'Sweep' }}

on:
  # Started twice a day (9:00 AM and 9:00 PM Bogotá) by cron-job.org, which calls GitHub's "run workflow"
  # API with a token limited to Actions on this repository: GitHub's own `schedule` never fired in this
  # repository (a known, undocumented problem of new private repositories), so it isn't used. See the
  # README, "Deployment". Two runs a day: the evening one catches the day's posts, and a missed run
  # doesn't leave the site stale. They share Gemini's daily quotas (the usage is in the state) and never
  # overlap (concurrency below).
  workflow_dispatch:
    inputs:
      days:
        description: "Only analyze posts from the last N days (1 to 30)"
        type: number
        default: 7
      all_accounts:
        description: "Read every account now (normally each sweep reads the accounts whose turn it is, once a day)"
        type: boolean
        default: false
      post_url:
        description: "Admin tools: add this one post by hand instead of sweeping"
        required: false
      account:
        description: "Admin tools: the post's @account, if its link doesn't say it"
        required: false
      issue:
        description: "Admin tools: the issue to answer"
        required: false
      again:
        description: "Admin tools: read the post again even if it was read before and hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write # push the sweep-state branch of this repository
  issues: write # the "Sweep health" issue

concurrency:
  group: data
  cancel-in-progress: false

env:
  SITE_OWNER: pa-bailar
  SITE_REPO: pa-bailar.github.io
  STATE_FILES: state # where the code keeps its state (config.STATE_DIR); copied to/from the sweep-state branch
  MERGE_TIMEOUT_MINUTES: 20
  HEALTH_REPORT_FILE: ${{ github.workspace }}/health.md # written by the sweep (pa_bailar/health.py)
  NOTIFY: jzamora5 # mentioned in the health issue, so GitHub emails them

jobs:
  # Adding a post by hand publishes it without the filter, and may add its account to main: only for a
  # request the admin workflow passed on (an open `admin` issue by the owner). Whoever can start this workflow
  # otherwise (the cron-job.org token) can't use it to publish anything, nor put text into a shell command.
  # Skipped (no runner, no minute billed) for a regular sweep.
  request:
    if: ${{ inputs.post_url != '' || inputs.issue != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # the answer when the request can't start
    steps:
      - name: Check the admin request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          POST_URL: ${{ inputs.post_url }}
        run: |
          if [ -z "$POST_URL" ] || ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Adding a post needs post_url and the number of the admin issue that asked for it."
            exit 1
          fi
          ok="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state,author,labels \
            --jq '.state == "OPEN" and .author.login == env.NOTIFY and any(.labels[]; .name == "admin")')"
          if [ "$ok" != "true" ]; then
            echo "::error::#$ISSUE isn't an open admin request by $NOTIFY."
            exit 1
          fi

      # The sweep job won't run, so its answer neither: say it here. Only on an open admin issue by the owner,
      # never on another issue whose number was passed in.
      - name: Answer on the admin issue that adding couldn't start
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then exit 0; fi
          ok="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state,author,labels \
            --jq '.state == "OPEN" and .author.login == env.NOTIFY and any(.labels[]; .name == "admin")')" || exit 0
          if [ "$ok" != "true" ]; then exit 0; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "❌ No pude empezar a agregarla (el pedido llegó incompleto, o GitHub no respondió). Detalles en [la ejecución]($RUN_URL)."

  sweep:
    needs: request
    # After the request check, or without it (a regular sweep: `request` skipped).
    if: ${{ !cancelled() && needs.request.result != 'failure' }}
    runs-on: ubuntu-latest
    # The sweep step stops at 35 minutes (its own budget is 30); the rest (state, PR, merge wait) fits in
    # the remaining time. A step timeout counts as a failure, so the steps that keep progress still run;
    # a job timeout would cancel them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without stored credentials: the sweep runs third-party packages, so the token that can push here is
      # only handed to the step that saves the state (below).
      - name: Read the sweep state
        uses: actions/checkout@v7
        with:
          ref: sweep-state
          path: sweep-state
          persist-credentials: false

      - run: mkdir -p "$STATE_FILES" && cp sweep-state/*.json "$STATE_FILES"/

      # Public: read without credentials. The App token is only created after the sweep, for the PR.
      - name: Check out the site repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_OWNER }}/${{ env.SITE_REPO }}
          persist-credentials: false
          path: site

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Videos' preview clips (pa_bailar/clips.py) need ffmpeg; usually already on the runner.
      - name: Make sure ffmpeg is installed
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # The sweep reads the events from the site's main: if an earlier data PR never merged (its ci failed,
      # or it timed out), sweeping now would leave its events behind for good (their posts are already marked
      # as analyzed). Stop until it's merged or fixed; the failed run emails, like any failure.
      - name: Make sure the last data PR merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list --repo "$SITE_OWNER/$SITE_REPO" --label data --state open --json url --jq '.[].url')"
          if [ -n "$open" ]; then
            echo "::error::A data PR hasn't merged: ${open}. Merge or fix it first (its events aren't on main)."
            exit 1
          fi

      - name: Run the sweep
        id: sweep
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_LITE_ONLY: ${{ vars.GEMINI_LITE_ONLY }} # "1": Flash-Lite extracts too (config.LITE_ONLY)
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DATA_DIR: ${{ github.workspace }}/site/data
          LOOKBACK_DAYS: ${{ inputs.days || '7' }}
          POST_URL: ${{ inputs.post_url }}
          ACCOUNT: ${{ inputs.account }}
          ADMIN_REPORT_FILE: ${{ github.workspace }}/admin-report.md
          ALL_ACCOUNTS: ${{ inputs.all_accounts && '--all' || '' }}
          AGAIN: ${{ inputs.again && '--again' || '' }}
        run: |
          if [ -n "$POST_URL" ]; then
            python -m pa_bailar sweep --post "$POST_URL" ${ACCOUNT:+--account "$ACCOUNT"} $AGAIN
          else
            python -m pa_bailar sweep --days "$LOOKBACK_DAYS" $ALL_ACCOUNTS
          fi

      # The admin page (admin-web/, docs/ADMIN.md) shows this: `admin status` as data, saved with the state.
      # One Graph API call (is the token working, the app's hourly usage); no Gemini.
      - name: Write the status for the admin page
        if: ${{ !cancelled() }}
        continue-on-error: true # the page can wait; the state must still be saved
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DATA_DIR: ${{ github.workspace }}/site/data
        run: python -m pa_bailar admin status --json > "$STATE_FILES/status.json.tmp" && mv "$STATE_FILES/status.json.tmp" "$STATE_FILES/status.json"

      - name: Get a token for the site repository (pa-bailar-bot)
        id: app
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.SITE_OWNER }}
          repositories: ${{ env.SITE_REPO }}

      - name: Open a data pull request in the site repository if events or flyers changed
        id: pr
        if: ${{ !cancelled() }} # keep progress from a sweep that failed partway (it still shows as failed)
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          WHAT: ${{ inputs.post_url && 'post added by hand' || 'daily sweep' }}
        run: |
          # Only events and flyers count as a change: meta.json is rewritten every run (with the check time).
          if [ -z "$(git status --porcelain -- data/events.json data/flyers)" ]; then
            echo "No new or changed events: no pull request."
            exit 0
          fi
          gh auth setup-git  # git pushes with the App token (GH_TOKEN), only from here on
          bot_id="$(gh api "/users/${BOT}" --jq .id)"
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          day="$(date -u +%F)"
          branch="data/sweep-${day}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add data/
          git commit -m "chore(data): ${WHAT} ${day}"
          git push origin "$branch"
          url="$(gh pr create --repo "$SITE_OWNER/$SITE_REPO" --base main --head "$branch" --label data \
            --title "chore(data): ${WHAT} ${day}" \
            --body "Automatic data update (${WHAT}, run ${GITHUB_RUN_ID} of the backend). Merges itself when \`ci\` passes.")"
          gh pr merge "$url" --auto --squash --delete-branch
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      # If the data PR couldn't be opened (the App token, GitHub's API, the push), the sweep's events and flyers
      # would die with the runner: keep them for 14 days, to recover by hand (docs/ARCHITECTURE.md, section 15).
      - name: Keep the site data of a data PR that wasn't opened
        if: ${{ !cancelled() && steps.pr.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-data-${{ github.run_id }}
          path: site/data
          retention-days: 14

      # Kept even when the sweep failed partway: its progress (analyzed posts) is real, and its events went out
      # in the data PR above. Unless that PR couldn't be opened: then those events exist only on this runner (and
      # in the artifact above), so the posts stay unread and the accounts due, and the next run reads them again.
      # Gemini's usage, the run history and the status are kept either way (the quota was spent).
      - name: Save the sweep state
        if: ${{ !cancelled() }}
        working-directory: sweep-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          cp "$GITHUB_WORKSPACE/$STATE_FILES"/*.json .
          if [ "$PR_OUTCOME" != "success" ]; then
            for file in processed_posts.json accounts.json; do
              git checkout -q -- "$file" 2>/dev/null || rm -f "$file"
            done
            echo "::warning::The data PR wasn't opened: this run's posts stay unread, to be read again next run."
          fi
          if [ -z "$(git status --porcelain)" ]; then echo "State unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A  # new state files too (commit -a would skip them)
          git commit -qm "chore(state): sweep $(date -u +%FT%H:%MZ)"
          gh auth setup-git  # git pushes with GH_TOKEN, which only this step has
          git push -q origin HEAD:sweep-state

      # add-post adds the account when it isn't swept yet (storage.add_account).
      - name: Save an account added by hand
        if: ${{ !cancelled() && inputs.post_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if git diff --quiet -- accounts.txt; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git commit -qm "chore(accounts): add the account of a post added by hand (#${ISSUE})" -- accounts.txt
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      # Health (pa_bailar/health.py): rules over this run and the previous ones, no AI. While there are
      # warnings, one open issue holds the latest report; a comment (which GitHub emails) is added only when
      # the warnings change, and the issue closes itself once they're gone.
      - name: Update the sweep health issue
        if: ${{ !cancelled() && steps.sweep.outputs.fingerprint != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WARNINGS: ${{ steps.sweep.outputs.warnings }}
          FINGERPRINT: ${{ steps.sweep.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue="$(gh issue list --label sweep-health --state open --json number --jq '.[0].number // empty')"
          if [ "$WARNINGS" = "0" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "All clear in [this run]($RUN_URL)."; fi
            exit 0
          fi
          { cat "$HEALTH_REPORT_FILE"; echo; echo "cc @$NOTIFY"; } > comment.md
          if [ -z "$issue" ]; then
            gh label create sweep-health --color d93f0b --description "Opened by the daily sweep" --force
            gh issue create --title "Sweep health: needs a look" --label sweep-health --body-file comment.md
            exit 0
          fi
          previous="$(gh issue view "$issue" --json body --jq .body | grep -o 'health-fingerprint: [0-9a-f]*' || true)"
          gh issue edit "$issue" --body-file "$HEALTH_REPORT_FILE"
          if [ "$previous" != "health-fingerprint: $FINGERPRINT" ]; then
            gh issue comment "$issue" --body-file comment.md
          fi

      # Its merge triggers the site's deploy (with meta.json's time, which is this sweep's).
      - name: Wait for the data PR to merge
        if: ${{ !cancelled() && steps.pr.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          deadline=$(( $(date +%s) + MERGE_TIMEOUT_MINUTES * 60 ))
          while true; do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then echo "Merged."; break; fi
            if [ "$state" = "CLOSED" ]; then echo "::error::The data PR was closed without merging."; exit 1; fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::The data PR did not merge within ${MERGE_TIMEOUT_MINUTES} minutes (did ci fail?): $PR_URL"
              exit 1
            fi
            sleep 30
          done

      - name: Republish the site with the time of this check (days without new events)
        if: ${{ success() && steps.pr.outputs.url == '' && inputs.post_url == '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh workflow run deploy.yml --repo "$SITE_OWNER/$SITE_REPO" --ref main \
            -f checked_at="$(TZ=America/Bogota date --iso-8601=seconds)"

      # Dead man's switch (optional, only if the HEALTHCHECK_URL secret exists, e.g. a free healthchecks.io
      # check): every run reports success or failure, and the service emails when runs fail or stop
      # arriving at all, the case GitHub itself never reports.
      - name: Report to the health check
        if: ${{ always() && inputs.post_url == '' }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          # The health report goes along as the ping's body: it shows in the check's event log.
          if [ -f "$HEALTH_REPORT_FILE" ]; then body="$HEALTH_REPORT_FILE"; else body=/dev/null; fi
          curl -fsS -m 10 --retry 3 --data-binary "@$body" "$url" > /dev/null

      # Admin tools: the answer to "add this post", on the issue that asked (and the issue closes).
      - name: Answer on the admin issue
        if: ${{ always() && inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$GITHUB_WORKSPACE/admin-report.md"
          if [ ! -s "$report" ]; then echo "❌ Algo falló al agregarla." > "$report"; fi
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> "$report"; echo "⚠️ La ejecución tuvo un problema: [detalles]($RUN_URL)." >> "$report"
          elif [ -n "$PR_URL" ]; then
            echo "" >> "$report"; echo "Publicado en el sitio ([cambio de datos]($PR_URL))." >> "$report"
          fi
          gh issue comment "$ISSUE" --body-file "$report"
          gh issue close "$ISSUE" --reason completed
