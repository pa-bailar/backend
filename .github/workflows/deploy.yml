# Builds the Astro site and publishes it to GitHub Pages.
# Runs when site code or data changes on main (merged PRs), from the manual button, and every day from
# the daily sweep, which passes the time of its check so "Actualizado el …" stays current even on days
# without new events. (The sweep's own data merges are made by the workflow token, which doesn't
# trigger push workflows, so the sweep always starts this itself.)
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - ".nvmrc"
  workflow_dispatch:
    inputs:
      checked_at:
        description: "When the data was last checked (ISO time); defaults to meta.json's generated_at"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          PUBLIC_CHECKED_AT: ${{ inputs.checked_at }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
